serviceAccount:
  create: true
  name: "vault-secrets-webhook"
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/k8s-prod-vault-secrets-webhook-irsa

configMapMutation: true
replicaCount: 2
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    scheme: https
    tlsConfig:
      insecureSkipVerify: true

resources:
  limits:
    cpu: 1200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"

nodeSelector:
  nodepool: "infra"
