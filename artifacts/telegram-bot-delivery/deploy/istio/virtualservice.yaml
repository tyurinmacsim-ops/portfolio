apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: lead-qualifier-bot
  namespace: lead-qualifier-bot
spec:
  hosts:
    - lead-qualifier-bot.prod.example.com
  gateways:
    - istio-system/external-ingress-gateway
  http:
    - name: "telegram-webhook"
      match:
        - uri:
            prefix: /telegram/webhook
      route:
        - destination:
            host: lead-qualifier-bot
            port:
              number: 8080
